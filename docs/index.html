<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teachings — Dharma</title>
    <meta
      name="description"
      content="Teachings (Dharma): the Words of the Buddha and commentarial treatises, translated and modernized for readability."
    />
    <!-- Canonical + alternate are updated per page by docs.js as the route
         changes; these are the defaults for the docs home. -->
    <link rel="canonical" href="https://empty.guru/docs/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="alternate" type="text/markdown" href="README.md" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="empty.guru" />
    <meta property="og:title" content="Teachings — Dharma" />
    <meta
      property="og:description"
      content="The Words of the Buddha and commentarial treatises, translated and modernized for readability."
    />
    <meta property="og:url" content="https://empty.guru/docs/" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Teachings — Dharma" />
    <meta
      name="twitter:description"
      content="The Words of the Buddha and commentarial treatises, translated and modernized for readability."
    />
    <link rel="stylesheet" href="../site/noto-fonts.css" />
    <link rel="stylesheet" href="../site/vendor/katex/katex.min.css" />
    <!-- Where Leaftext's own renderer is served from, and the stylesheet it
         draws a document with. Both are built when leaftext.com publishes and
         are served from there, so nothing of either is copied into this repo. -->
    <meta name="leaftext-renderer" content="https://leaftext.com/assets/leaftext/" />
    <link rel="stylesheet" href="https://leaftext.com/assets/leaftext/leaftext.css" />
    <link rel="stylesheet" href="../site/styles.css" />
    <link rel="stylesheet" href="docs.css" />
    <!-- Apply the saved theme and panel toggles before first paint (no flash).
         Keys mirror ../site/settings.js; "System" resolves to the device theme. -->
    <script>
      (function () {
        try {
          var d = document.documentElement,
            s = window.localStorage;
          var m = s.getItem('leaf.theme') || 'system';
          var t =
            m === 'light' || m === 'dark' || m === 'dracula'
              ? m
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          d.dataset.theme = t;
          // The document's own paint comes from Leaftext's stylesheet, which
          // keys on a theme family and an appearance.
          d.dataset.leafTheme = t === 'dracula' ? 'nightshade' : 'github';
          d.dataset.leafAppearance = t === 'light' ? 'light' : 'dark';
          if (s.getItem('leaf.minimap') === '0') d.dataset.minimap = 'off';
          if (s.getItem('leaf.library') === '0') d.dataset.library = 'off';
          if (s.getItem('leaf.speedReader') === '1') d.dataset.speedReader = 'true';
          if (s.getItem('leaf.lineNumbers') !== '1') d.dataset.lineNumbers = 'off';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <nav class="docs-sidebar" id="sidebar" aria-label="Documentation"></nav>
    <main class="page">
      <select class="docs-mobile-nav" id="mobileNav" aria-label="Documentation pages"></select>
      <article class="markdown-body" id="content" tabindex="-1"></article>
      <!-- The status line speaks only when something failed. It carries no waiting
           text: a page that cannot say when it will finish should not promise
           that it will. -->
      <p class="status" id="status" hidden></p>
      <!-- The Previous/Next strip is part of what the renderer draws, filled
           from the sidebar's order — this page no longer holds one of its own. -->
    </main>
    <script type="module" src="docs.js"></script>
  </body>
</html>
