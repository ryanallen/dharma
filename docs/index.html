    <!-- Every page of the documentation is read in the app at the top of the site now. This address stays because links to it are out in the world: it sends each one on to the page it named, #/features/minimap to the minimap page, and a bare /docs/ to the documentation's own front page. A route is a file's path under docs/ with the ordering numbers and .md taken off each part, which is exactly what is undone here. -->
    <script>
      (function () {
        var files = [];
        try {
          files = JSON.parse(document.getElementById('docs-pages').textContent || '[]');
        } catch (e) {}
        var clean = function (path) {
          return path
            .split('/')
            .map(function (part) {
              return part.replace(/^\d+[-_]+/, '');
            })
            .join('/')
            .replace(/\.md$/i, '');
        };
        var hash = location.hash || '';
        var rest = hash.indexOf('#/') === 0 ? hash.slice(2) : '';
        var cut = rest.indexOf('#');
        var route = (cut >= 0 ? rest.slice(0, cut) : rest).replace(/\/+$/, '');
        var anchor = cut >= 0 ? rest.slice(cut + 1) : '';
        try {
          route = decodeURIComponent(route);
        } catch (e) {}
        var file = 'README.md';
        if (route) {
          for (var i = 0; i < files.length; i += 1) {
            if (clean(files[i]) === route || files[i] === route) {
              file = files[i];
              break;
            }
          }
        }
        location.replace((document.documentElement.hasAttribute('data-doc-pages') ? file.replace(/\.md$/i, '.html') : '../#docs/' + file) + (anchor ? '#' + anchor : ''));
      })();
