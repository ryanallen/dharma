<!--

-->
<head>

      name="description"
      content="Buddhist texts put into English from public-domain editions, standing on one shelf in the order they were written."
    />

    <!-- The shelf is drawn from this Markdown file; it is the machine-readable alternate, so crawlers and AI fetchers read the list without running JavaScript. -->
    <link rel="alternate" type="text/markdown" href="README.md" />
    <!-- The two AI indexes: every page of the site as a raw Markdown address. -->
    <link rel="alternate" type="text/plain" href="llms.txt" title="AI index — every page as Markdown" />
    <link rel="alternate" type="text/plain" href="llms-full.txt" title="AI index, with a description per page" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="empty.guru" />

      property="og:description"
